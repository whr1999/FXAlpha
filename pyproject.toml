[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fxalpha"
version = "0.1.0"
description = "Governed factor research, model training, and Qlib paper trading platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "FXAlpha contributors" }]
keywords = ["quantitative-finance", "factor-research", "qlib", "paper-trading"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "anyio>=4.0,<5",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "lightgbm>=4.0,<5",
  "mcp>=1.20,<2",
  "mlflow>=3.0,<4",
  "numpy>=2.0,<3",
  "openai>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<22",
  "pyyaml>=6,<7",
  "requests>=2.31,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "tqdm>=4.66,<5",
]

[project.urls]
Homepage = "https://github.com/whr1999/FXAlpha"
Repository = "https://github.com/whr1999/FXAlpha.git"
Documentation = "https://github.com/whr1999/FXAlpha/tree/main/docs"
Issues = "https://github.com/whr1999/FXAlpha/issues"

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
fxalpha = "cli:main"

[tool.setuptools]
py-modules = ["api_server", "cli"]

[tool.setuptools.packages.find]
include = ["domain*", "integrations*", "lib*", "mcp_servers*", "services*", "storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".venv",
  ".venv-test",
  "data",
  "runtime",
  "third_party",
  "mlruns",
  "log",
  "logs",
]
