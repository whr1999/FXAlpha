<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">FXAlpha 端到端系统架构与模块数据流</title>
  <desc id="desc">展示统一访问和服务治理层之下，Tushare 数据如何经过数据底座生成生产原始数据、QuantGPT 数据和 Qlib 数据，因子研究如何通过质量门禁进入因子库并形成带指纹特征快照，模型训练如何进入模型库并晋升生产模型，最后进入预测、组合建议与 Qlib 模拟交易。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="service" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24336f"/>
      <stop offset="1" stop-color="#4358bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#27345e" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#5f70a8"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#3850b0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#31856c"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #17213f; }
      .title { font-size: 36px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #5b688c; letter-spacing: 0.7px; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: 1.8px; fill: #526087; }
      .module-title { font-size: 20px; font-weight: 700; }
      .node-title { font-size: 16px; font-weight: 700; }
      .node-en { font-size: 11px; font-weight: 700; fill: #647195; letter-spacing: 0.7px; }
      .body { font-size: 13px; fill: #5a6787; }
      .small { font-size: 12px; fill: #687493; }
      .white { fill: #ffffff; }
      .white-muted { fill: #dce4ff; }
      .box { fill: #ffffff; stroke: #d5def1; stroke-width: 1.5; }
      .external { fill: #ffffff; stroke: #c6d0e7; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .data { fill: #eaf9f3; stroke: #82c8ae; stroke-width: 1.7; }
      .factor { fill: #fff3e9; stroke: #eba66d; stroke-width: 1.7; }
      .library { fill: #f5efff; stroke: #ab96df; stroke-width: 1.7; }
      .feature { fill: #f4f0ff; stroke: #a48fe0; stroke-width: 1.7; }
      .model { fill: #edf5ff; stroke: #89b0e4; stroke-width: 1.7; }
      .prediction { fill: #eef8ff; stroke: #8cbcd7; stroke-width: 1.7; }
      .recommend { fill: #fff8e9; stroke: #e3bd69; stroke-width: 1.7; }
      .paper { fill: #fff0f4; stroke: #e49aae; stroke-width: 1.7; }
      .readonly { fill: #f8fafc; stroke: #bdc8dc; stroke-width: 1.5; }
      .gate { fill: #ffffff; stroke: #d4a544; stroke-width: 1.4; }
      .storage { fill: #f8fafc; stroke: #c4cfe3; stroke-width: 1.5; }
      .flow { fill: none; stroke: #5f70a8; stroke-width: 2.2; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #3850b0; stroke-width: 3; marker-end: url(#arrowBlue); }
      .flow-green { fill: none; stroke: #31856c; stroke-width: 2.6; marker-end: url(#arrowGreen); }
      .flow-dashed { fill: none; stroke: #7f8bad; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .bus { fill: none; stroke: #7590c7; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1800" height="1180" fill="url(#bg)"/>
  <text x="62" y="60" class="title">FXAlpha 端到端系统架构与模块数据流</text>
  <text x="62" y="91" class="subtitle">DATA FOUNDATION → FACTOR RESEARCH → FEATURE SNAPSHOT → MODEL TRAINING → PREDICTION → QLIB PAPER TRADING</text>

  <text x="62" y="136" class="section">01  统一访问与治理层 / ACCESS &amp; GOVERNANCE</text>

  <rect x="62" y="157" width="240" height="74" rx="17" class="box"/>
  <text x="86" y="187" class="node-title">Web GUI / HTTP API</text>
  <text x="86" y="212" class="small">人工操作、状态与确认</text>

  <rect x="326" y="157" width="220" height="74" rx="17" class="box"/>
  <text x="350" y="187" class="node-title">CLI</text>
  <text x="350" y="212" class="small">诊断、CI 与故障回退</text>

  <rect x="570" y="157" width="240" height="74" rx="17" class="box"/>
  <text x="594" y="187" class="node-title">MCP Servers</text>
  <text x="594" y="212" class="small">QuantGPT · Model · Platform</text>

  <rect x="834" y="157" width="260" height="74" rx="17" class="box"/>
  <text x="858" y="187" class="node-title">Orchestrator / Systemd</text>
  <text x="858" y="212" class="small">状态机、定时、重试和恢复</text>

  <rect x="1120" y="157" width="618" height="74" rx="17" fill="url(#service)" filter="url(#shadow)"/>
  <text x="1148" y="187" class="node-title white">共享服务与领域门禁 / services + domain</text>
  <text x="1148" y="212" class="white-muted" font-size="13">preflight · confirmation · quality gate · registry · lock · idempotency · audit</text>

  <path d="M182 231 V264 H1429 V237" class="flow-blue"/>
  <path d="M436 231 V264" class="flow"/>
  <path d="M690 231 V264" class="flow"/>
  <path d="M964 231 V264" class="flow"/>

  <text x="62" y="313" class="section">02  核心研究与资产晋升链 / CORE RESEARCH &amp; PROMOTION FLOW</text>

  <rect x="62" y="335" width="210" height="72" rx="16" class="external"/>
  <text x="86" y="365" class="node-title">Tushare Fork</text>
  <text x="86" y="389" class="small">行情、财务、状态与日历</text>

  <rect x="62" y="438" width="300" height="260" rx="22" class="data" filter="url(#shadow)"/>
  <text x="88" y="474" class="node-en">MODULE 1 · DATA FOUNDATION</text>
  <text x="88" y="506" class="module-title">数据底座</text>
  <text x="88" y="539" class="body">① 下载/增量合并到独立 staging</text>
  <text x="88" y="566" class="body">② 字段、日期、价格与覆盖率质量检查</text>
  <text x="88" y="593" class="body">③ 血缘和下游兼容性审计</text>
  <text x="88" y="620" class="body">④ 通过后原子晋升 production</text>
  <line x1="88" y1="641" x2="336" y2="641" stroke="#90cdb8"/>
  <text x="88" y="668" class="small">输出：raw HDF/metadata/calendar</text>
  <text x="88" y="690" class="small">并生成 QuantGPT 与 Qlib 数据视图</text>

  <path d="M167 407 V432" class="flow-green"/>

  <rect x="388" y="335" width="240" height="72" rx="16" class="external"/>
  <text x="412" y="365" class="node-title">QuantGPT Fork + LLM</text>
  <text x="412" y="389" class="small">表达式、评分、回测与研究判断</text>

  <rect x="388" y="438" width="300" height="260" rx="22" class="factor" filter="url(#shadow)"/>
  <text x="414" y="474" class="node-en">MODULE 2 · FACTOR RESEARCH</text>
  <text x="414" y="506" class="module-title">因子研究</text>
  <text x="414" y="539" class="body">① Orchestrator 生成经济假设与表达式</text>
  <text x="414" y="566" class="body">② 表达式校验与快速评分</text>
  <text x="414" y="593" class="body">③ novelty / anti-overfit / rolling</text>
  <text x="414" y="620" class="body">④ adversarial + 最终 quality gate</text>
  <line x1="414" y1="641" x2="662" y2="641" stroke="#e6af81"/>
  <text x="414" y="668" class="small">只允许 adopted 候选受控 import</text>
  <text x="414" y="690" class="small">失败候选保留负面证据，不进入因子库</text>

  <path d="M508 407 V432" class="flow"/>
  <path d="M362 568 H382" class="flow-blue"/>
  <text x="371" y="548" class="small" text-anchor="middle">QuantGPT 数据</text>

  <rect x="714" y="438" width="250" height="260" rx="22" class="library" filter="url(#shadow)"/>
  <text x="740" y="474" class="node-en">MODULE 3 · FACTOR LIBRARY</text>
  <text x="740" y="506" class="module-title">因子库</text>
  <text x="740" y="539" class="body">factor registry</text>
  <text x="740" y="566" class="body">active / retired 状态</text>
  <text x="740" y="593" class="body">表达式、质量、相关性与血缘</text>
  <text x="740" y="620" class="body">active factor values</text>
  <line x1="740" y1="641" x2="938" y2="641" stroke="#b5a2dd"/>
  <text x="740" y="668" class="small">输出：当前可用于模型的因子集合</text>
  <text x="740" y="690" class="small">审计/退役会改变下一份 feature snapshot</text>

  <path d="M688 568 H708" class="flow-blue"/>
  <rect x="674" y="523" width="48" height="30" rx="15" class="gate"/>
  <text x="698" y="543" class="small" text-anchor="middle">Gate</text>

  <rect x="990" y="438" width="230" height="260" rx="22" class="feature" filter="url(#shadow)"/>
  <text x="1016" y="474" class="node-en">GOVERNED HANDOFF</text>
  <text x="1016" y="506" class="module-title">特征快照</text>
  <text x="1016" y="539" class="body">active factor matrix</text>
  <text x="1016" y="566" class="body">data date window</text>
  <text x="1016" y="593" class="body">registry fingerprint</text>
  <text x="1016" y="620" class="body">feature-set manifest</text>
  <line x1="1016" y1="641" x2="1194" y2="641" stroke="#b5a2dd"/>
  <text x="1016" y="668" class="small">锁定模型输入血缘</text>
  <text x="1016" y="690" class="small">禁止读取任意“最新因子文件”</text>

  <path d="M964 568 H984" class="flow-blue"/>

  <rect x="1246" y="335" width="230" height="72" rx="16" class="external"/>
  <text x="1270" y="365" class="node-title">Microsoft Qlib Fork</text>
  <text x="1270" y="389" class="small">数据集、训练、评估与策略语义</text>

  <rect x="1246" y="438" width="300" height="260" rx="22" class="model" filter="url(#shadow)"/>
  <text x="1272" y="474" class="node-en">MODULE 4 · MODEL TRAINING</text>
  <text x="1272" y="506" class="module-title">模型训练与评估</text>
  <text x="1272" y="539" class="body">① feature/model preflight</text>
  <text x="1272" y="566" class="body">② Qlib 训练与多 seed 稳定性</text>
  <text x="1272" y="593" class="body">③ Rolling / forward test</text>
  <text x="1272" y="620" class="body">④ 评分、诊断和生产 refit</text>
  <line x1="1272" y1="641" x2="1520" y2="641" stroke="#9cbce3"/>
  <text x="1272" y="668" class="small">训练完成 ≠ 生产晋升</text>
  <text x="1272" y="690" class="small">完整证据进入 model registry</text>

  <path d="M1361 407 V432" class="flow"/>
  <path d="M1220 568 H1240" class="flow-blue"/>

  <rect x="1572" y="438" width="166" height="260" rx="22" class="library" filter="url(#shadow)"/>
  <text x="1598" y="474" class="node-en">MODULE 5</text>
  <text x="1598" y="506" class="module-title">模型库</text>
  <text x="1598" y="539" class="body">research</text>
  <text x="1598" y="566" class="body">rolling</text>
  <text x="1598" y="593" class="body">production</text>
  <text x="1598" y="620" class="body">model lineage</text>
  <line x1="1598" y1="641" x2="1712" y2="641" stroke="#b5a2dd"/>
  <text x="1598" y="668" class="small">显式晋升</text>
  <text x="1598" y="690" class="small">production pointer</text>

  <path d="M1546 568 H1566" class="flow-blue"/>
  <rect x="1532" y="523" width="48" height="30" rx="15" class="gate"/>
  <text x="1556" y="543" class="small" text-anchor="middle">Gate</text>

  <path d="M212 698 V748 H1396" class="bus"/>
  <path d="M839 698 V748" class="flow-dashed"/>
  <path d="M1105 698 V748" class="flow-dashed"/>
  <path d="M1396 698 V742" class="flow-dashed"/>
  <text x="262" y="739" class="small">Qlib 数据视图：统一交易日历、标的、特征与可交易性</text>

  <text x="62" y="802" class="section">03  生产消费链 / PRODUCTION CONSUMPTION FLOW</text>

  <rect x="462" y="826" width="260" height="178" rx="21" class="readonly" filter="url(#shadow)"/>
  <text x="488" y="860" class="node-en">READ-ONLY CONSUMER</text>
  <text x="488" y="891" class="module-title">个股研究</text>
  <text x="488" y="924" class="body">生产数据 + 模型/因子只读投影</text>
  <text x="488" y="951" class="body">行情、质量、预测与解释展示</text>
  <text x="488" y="979" class="small">不改变核心研究或交易资产</text>

  <rect x="754" y="826" width="260" height="178" rx="21" class="prediction" filter="url(#shadow)"/>
  <text x="780" y="860" class="node-en">MODULE 6 · PREDICTION</text>
  <text x="780" y="891" class="module-title">生产预测</text>
  <text x="780" y="924" class="body">production model + latest Qlib data</text>
  <text x="780" y="951" class="body">生成并校验 pred / score</text>
  <text x="780" y="979" class="small">模型、数据日期与血缘必须一致</text>

  <rect x="1046" y="826" width="260" height="178" rx="21" class="recommend" filter="url(#shadow)"/>
  <text x="1072" y="860" class="node-en">MODULE 7 · RECOMMENDATION</text>
  <text x="1072" y="891" class="module-title">组合建议</text>
  <text x="1072" y="924" class="body">score → selection → target weights</text>
  <text x="1072" y="951" class="body">风控、现金目标与 T+1 pending</text>
  <text x="1072" y="979" class="small">冻结推荐，禁止未来信息覆盖</text>

  <rect x="1338" y="826" width="400" height="178" rx="21" class="paper" filter="url(#shadow)"/>
  <text x="1364" y="860" class="node-en">MODULE 8 · QLIB PAPER TRADING</text>
  <text x="1364" y="891" class="module-title">模拟交易</text>
  <text x="1364" y="924" class="body">账户 + model deployment + pending recommendation</text>
  <text x="1364" y="951" class="body">Qlib 成交价/费用/交易单位/涨跌停语义</text>
  <text x="1364" y="979" class="small">输出 executions、positions、snapshots、PnL · 非 vn.py</text>

  <path d="M655 698 V796 H592 V820" class="flow-dashed"/>
  <path d="M1655 698 V782 H884 V820" class="flow-blue"/>
  <text x="1260" y="773" class="small">production model pointer</text>
  <path d="M722 915 H748" class="flow"/>
  <path d="M1014 915 H1040" class="flow-blue"/>
  <path d="M1306 915 H1332" class="flow-blue"/>

  <rect x="62" y="826" width="364" height="178" rx="21" class="readonly" filter="url(#shadow)"/>
  <text x="88" y="860" class="node-en">CROSS-MODULE CONTROL</text>
  <text x="88" y="891" class="module-title">平台总览与运维</text>
  <text x="88" y="924" class="body">聚合各模块 snapshot/readiness</text>
  <text x="88" y="951" class="body">后台定时流程、资源与安全清理预览</text>
  <text x="88" y="979" class="small">状态健康不替代下游模块 preflight</text>

  <text x="62" y="1054" class="section">04  状态与存储层 / STATE &amp; STORAGE</text>
  <rect x="62" y="1075" width="822" height="76" rx="17" class="storage"/>
  <text x="88" y="1106" class="node-title">data/ 持久资产</text>
  <text x="88" y="1133" class="body">raw HDF · Qlib · QuantGPT · factor registry/values · model registry/artifacts · trading ledger</text>

  <rect x="916" y="1075" width="822" height="76" rx="17" class="storage"/>
  <text x="942" y="1106" class="node-title">runtime/ 运行证据</text>
  <text x="942" y="1133" class="body">task status · events · traces · jobs · checkpoints · locks · audit reports · recovery evidence</text>

  <path d="M450 1075 V1031 H1410 V1010" class="flow-dashed"/>
  <path d="M1327 1075 V1031 H244 V1010" class="flow-dashed"/>
</svg>
